<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#06070d">
  <meta name="color-scheme" content="dark">
  <title>Caccia al Tesoro</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,72,400..900,0..100,0..1;1,72,400..600,100,1&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="../assets/hidden.css?v=20261107">
  <link rel="stylesheet" href="arancione.css?v=20261107">
</head>
<body>
  <!-- Hidden page: reached only through the final riddle, never linked from the site. -->
  <canvas id="sea" class="sea" aria-hidden="true"></canvas>
  <div class="ambience" aria-hidden="true"></div>

  <main class="stage">
    <video id="film" class="film" controls playsinline preload="auto" hidden></video>
  </main>

  <section id="notice" class="notice" aria-live="polite">
    <!-- Decorative: the one bulb still lit over the panel (it falters when something goes wrong). -->
    <span class="notice-lamp" aria-hidden="true"></span>
    <p id="notice-title" class="notice-title">Il video affiora…</p>
    <!-- A light runs along a string of bulbs; while the video downloads, the bulbs fill up. -->
    <div id="notice-bar" class="notice-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p id="notice-amount" class="notice-amount" aria-hidden="true" hidden></p>
    <p id="notice-text" class="notice-text" hidden></p>
    <a id="notice-login" class="notice-action" href="../" hidden>Accedi alla caccia</a>
    <button id="notice-retry" class="notice-action" type="button" hidden>Riprova</button>
  </section>

  <noscript>
    <p class="notice notice-static">Per vedere il video serve JavaScript.</p>
  </noscript>

  <script src="../config.js?v=20261106"></script>
  <script src="../upside.js?v=20261106"></script>
  <script src="arancione.js?v=20261107"></script>
</body>
</html>
