<body>
  <!--
    THESIS: "Il Sottosopra". The same treasure hunt seen from the other side: cold blue-black air full of floating ash, a red storm pulsing overhead, and only fragile artificial light (string bulbs, a red rift glow, red lightning inside the clouds). Riddles are messages that cross the barrier.
    OWN-WORLD: void #06070d ground, dark glass panels #0e1220 with a red hairline, deep rift red #a3121a for the primary action, rift glow #ff4a3d for focus and active marks, warm paper text #ece6dd; string-bulb colours only for lights; amber is success. Fraunces (soft, wonky) for display and the red neon title, IBM Plex Sans for reading, Special Elite for typed labels and stamps.
    STORY: the player arrives under the storm, the title warms up like failing neon over its upside-down reflection, the alphabet wall answers the name they type, riddles hang on a string of lights, a sealed riddle waits behind the rift, and a saved answer makes the lights answer back.
    FIRST VIEWPORT: full-bleed ash and storm canvas under a grain and vignette layer; red neon stacked title with a wavering mirror image; the login panel, topped by the letter wall, low in the thumb zone.
    MOTION: flicker (reveals), pulse (sealed things), drift (ash, canvas only), glitch (one VHS slice on a view change), rare low-alpha lightning. Reduced motion shows every final state at once.
  -->
  <canvas id="sea" class="sea" aria-hidden="true"></canvas>
  <div class="ambience" aria-hidden="true"></div>

  <header class="site-header">
    <h1 class="title" aria-label="Caccia al Tesoro">
      <!-- The neon sign, then the same sign upside down beneath it: the world mirrored. -->
      <span class="title-neon" aria-hidden="true">
        <span class="title-line title-caccia" style="--i: 0">Caccia</span>
        <span class="title-line title-al" style="--i: 1">al</span>
        <span class="title-line title-tesoro" style="--i: 2">Tesoro</span>
      </span>
      <span class="title-mirror" aria-hidden="true">
        <span class="title-line title-caccia">Caccia</span>
        <span class="title-line title-al">al</span>
        <span class="title-line title-tesoro">Tesoro</span>
      </span>
    </h1>
    <div id="user-bar" class="user-bar" hidden>
      <span class="user-greeting"><span class="user-hello">Ciao, </span><strong id="user-name"></strong></span>
      <button id="logout-btn" type="button" class="btn-secondary">Esci</button>
    </div>
  </header>

  <main>
    <p id="config-warning" class="notice notice-error" hidden>
      Il sito non è ancora configurato: inserisci l'URL della Web App di Apps Script in
      <code>config.js</code> (vedi README).
    </p>

    <section id="register-section" class="card panel" hidden>
      <!-- Alphabet wall: one bulb over each painted letter, filled by lights.js (decorative). -->
      <div id="letter-wall" class="letter-wall" aria-hidden="true"></div>
      <h2>Entra nel gioco</h2>
      <form id="register-form" class="auth-form" data-mode="register" novalidate>
        <!-- One form, two modes: the toggle picks what the single submit button does. -->
        <fieldset class="mode-switch">
          <legend class="visually-hidden">Cosa vuoi fare</legend>
          <label class="mode-option">
            <input type="radio" name="auth-mode" value="login">
            <span>Accedi</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="auth-mode" value="register" checked>
            <span>Registrati</span>
          </label>
        </fieldset>

        <div class="field">
          <label for="username-input" class="field-label">Username</label>
          <input id="username-input" name="username" type="text" autocomplete="username"
                 autocapitalize="none" spellcheck="false" minlength="2" maxlength="30" required>
        </div>

        <div class="field">
          <label for="password-input" class="field-label">Password</label>
          <div class="password-wrap">
            <input id="password-input" name="password" type="password" autocomplete="new-password"
                   maxlength="50" required>
            <button id="password-toggle" type="button" class="password-toggle"
                    aria-label="Mostra password" aria-pressed="false" aria-controls="password-input confirm-input">
              <svg class="eye eye-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye eye-shut" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M4 20 20 4"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="field register-only" id="confirm-field">
          <label for="confirm-input" class="field-label">Ripeti la password</label>
          <input id="confirm-input" name="confirm" type="password" autocomplete="new-password"
                 maxlength="50" aria-describedby="confirm-error">
          <p id="confirm-error" class="field-error" role="alert"></p>
        </div>

        <button id="auth-submit" type="submit" class="auth-submit">Registrati</button>
        <p id="auth-status" class="visually-hidden" role="status"></p>
      </form>
      <p id="register-error" class="error" role="alert"></p>
    </section>

    <section id="puzzles-section" hidden>
      <p id="puzzles-status" class="muted puzzles-status" role="status"></p>
      <!-- Filled by the hash router in app.js: index (#/) or riddle page (#/enigma/<id>). -->
      <div id="puzzles-view"></div>
    </section>
  </main>

  <script src="config.js?v=20261106"></script>
  <script src="upside.js?v=20261106"></script>
  <script src="shadows.js?v=20261106"></script>
  <script src="crystal.js?v=20261106"></script>
  <script src="lights.js?v=20261106"></script>
  <script src="app.js?v=20261106"></script>
</body>
</html>
